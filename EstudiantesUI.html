<!-- Modulo Estudiantes -->

<div
  id="studentModal"
  class="modal">

  <div class="modal-content">

    <h2 id="modalTitle">
      Estudiante
    </h2>

    <input
      type="hidden"
      id="studentId">

    <div class="form-grid">

      <div>
        <label>Apellido</label>
        <input id="apellido">
      </div>

      <div>
        <label>Nombre</label>
        <input id="nombre">
      </div>

      <div>
        <label>DNI</label>
        <input id="dni">
      </div>

      <div>
        <label>Legajo</label>
        <input id="legajo">
      </div>

      <div>
        <label>Email</label>
        <input id="email">
      </div>

      <div>
        <label>Teléfono</label>
        <input id="telefono">
      </div>

      <div>
        <label>Fecha Nacimiento</label>

        <input
          type="date"
          id="fecha_nacimiento">
      </div>

      <div>
        <label>Carrera</label>

        <select id="carrera_id">
        </select>
      </div>

      <div class="full-width">

        <label>Observaciones</label>

        <textarea
          id="observaciones"
          rows="4">
        </textarea>

      </div>

    </div>

    <div class="modal-buttons">

      <button onclick="SaveStudent()">
        Guardar
      </button>

      <button onclick="CloseModal()">
        Cancelar
      </button>

    </div>

  </div>

</div>
